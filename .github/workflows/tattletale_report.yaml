name: TattleTale Report

on:
  pull_request:
    branches:
      - Feature/wrims-devops
  push:
    branches:
      - Feature/wrims-devops

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 1.8
        uses: actions/setup-java@v2
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Generate tattletale-reports
        env:
          PKG_USERNAME: ${{ github.actor }}
          PKG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew clean
          ./gradlew tattletaleReport

      - name: Upload Reports
        uses: actions/upload-artifact@v4.0.0
        with:
          name: reports
          path: |
            ./*/build/reports/**
